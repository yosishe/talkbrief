[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talkbrief"
version = "0.1.0"
description = "Turn a YouTube talk into a grounded, slide-by-slide interactive brief: deterministic slide extraction + transcript alignment, Claude-powered synthesis, and mechanical verification of every quote."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yosishe" }]
requires-python = ">=3.11"
keywords = [
    "youtube", "slides", "lecture", "transcript", "summarization",
    "claude", "video", "notes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "numpy>=1.26",
    "jinja2>=3.1",
    "jsonschema>=4.21",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
ocr = ["ocrmac>=1.0; sys_platform == 'darwin'"]
asr = ["faster-whisper>=1.0"]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
talkbrief = "talkbrief.cli:main"

[project.urls]
Homepage = "https://github.com/yosishe/talkbrief"
Issues = "https://github.com/yosishe/talkbrief/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/talkbrief"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access (excluded in CI)",
    "llm: needs a working, authenticated LLM backend (excluded in CI)",
]
addopts = "-m 'not network and not llm'"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = false
